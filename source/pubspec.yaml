name: amartaka
description: Bangla offline personal ledger by MEskander.
publish_to: none
version: 0.4.0+4
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: 2.4.2
  path: 1.9.1
  file_picker: 10.3.3
  flutter_secure_storage: 9.2.4
  cryptography: 2.7.0
  local_auth: 2.3.0
  flutter_local_notifications: 19.5.0
  timezone: 0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: 2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
