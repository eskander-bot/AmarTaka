name: Test and build Amar Taka
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      play_bundle:
        description: 'Build a signed Play AAB (requires upload-key secrets)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: amartaka-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Generate Android project
        run: python3 scripts/bootstrap.py
      - name: Bundle verified offline Bengali fonts
        run: python3 scripts/assets.py
      - name: Resolve dependencies
        working-directory: .build/amartaka
        run: flutter pub get
      - name: Analyze
        working-directory: .build/amartaka
        run: flutter analyze --no-fatal-infos
      - name: Test money, migrations, backup and UI
        working-directory: .build/amartaka
        run: flutter test
      - name: Upload actual Flutter UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Taka-UI-previews
          path: .build/amartaka/build/ui-previews/
          if-no-files-found: ignore
      - name: Configure permanent signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/signing.py
      - name: Build installable test APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .build/amartaka
        run: flutter build apk --debug --build-number=${{ github.run_number }}
      - name: Verify APK uses permanent certificate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/signing.py --verify-apk .build/amartaka/build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload APK and dependency lock
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Taka-test-APK
          path: |
            .build/amartaka/build/app/outputs/flutter-apk/app-debug.apk
            .build/amartaka/pubspec.lock
      - name: Build signed Play bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.play_bundle
        working-directory: .build/amartaka
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Upload signed bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.play_bundle
        uses: actions/upload-artifact@v4
        with:
          name: Amar-Taka-Play-AAB
          path: .build/amartaka/build/app/outputs/bundle/release/app-release.aab
      - name: Remove temporary signing material
        if: always()
        run: python3 scripts/signing.py --clean
