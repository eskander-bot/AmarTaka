name: Build Amar Taka APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (pinned 3.24.0)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Create Flutter project skeleton
        run: flutter create --org com.meskander --project-name amartaka --platforms android .

      - name: Copy our app code over the skeleton
        run: |
          rm -rf lib
          cp -r source/lib/. lib/
          rm -rf source

      - name: Add required dependencies
        run: flutter pub add sqflite path intl

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Amar Taka v1.0.0 (build ${{ github.run_number }})
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
