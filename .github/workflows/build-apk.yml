name: Build Amar Taka APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter skeleton
        run: flutter create --org com.meskander --project-name amartaka --platforms android .

      - name: Set app name
        run: sed -i 's/android:label="amartaka"/android:label="Amar Taka"/' android/app/src/main/AndroidManifest.xml

      - name: Copy app source code
        run: |
          rm -rf lib
          cp -r source/lib lib

      - name: Add dependencies
        run: flutter pub add sqflite path intl

      - name: Build APK
        run: flutter build apk --release

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Amar Taka v1.0.0 (build ${{ github.run_number }})
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
